[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqflow-scheduler"
version = "0.2.0"
description = "Codex task-tree scheduler with live quota and sleep-hour dispatch"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scheduler = "reqflow_scheduler.cli:main"
reqflow-scheduler = "reqflow_scheduler.cli:main"

[tool.setuptools.packages.find]
include = ["reqflow_scheduler*"]
